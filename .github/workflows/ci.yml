name: mkdocs-cdoc CI

on:
  push:
    branches: [ main, develop, semester-test-plan ]
  pull_request:
    branches: [ main, develop, semester-test-plan ]

jobs:
  quality-test-build:
    name: Lint, test, coverage and build on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Environment setup - install dependencies and plugin
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov flake8 pylint mypy mkdocs mkdocs-material

      - name: Static analysis - flake8
        run: flake8 mkdocs_cdoc

      - name: Static analysis - pylint
        run: pylint mkdocs_cdoc --fail-under=7.0

      - name: Static analysis - mypy strict
        run: mypy --strict mkdocs_cdoc

      - name: Unit and integration tests
        run: pytest -v tests

      - name: Coverage report
        run: pytest --cov=mkdocs_cdoc --cov-report=term-missing --cov-report=xml tests

      - name: Build validation - example MkDocs project
        run: mkdocs build -f example/mkdocs.yml --strict
